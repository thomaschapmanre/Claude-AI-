<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Unit F Walkthrough</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fbfe8; touch-action: none;
               font-family: system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; }
  #hint { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.55);
          color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 13px; pointer-events: none; text-align: center; }
  #stick { position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%;
           background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.5); display: none; touch-action: none; }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.7); }
  @media (pointer: coarse) { #stick { display: block; } }
</style>
</head>
<body>
<div id="hint">Loading…</div>
<div id="stick" aria-label="Movement joystick"><div id="knob"></div></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fbfe8);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 300);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;  // reflections for steel/nickel
scene.environmentIntensity = 0.5;
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d0c4, 1.2));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.2); sun.position.set(-10, 20, -15); scene.add(sun);

const hint = document.getElementById('hint');
const [cfg] = await Promise.all([fetch('collision.json').then(r => r.json())]);
new GLTFLoader().load('unit.glb', g => {
  scene.add(g.scene);
  for (const [x, y, z] of cfg.lights.slice(0, 12)) {     // shortcut: capped point lights for phone GPUs; bake lighting if it looks flat
    const l = new THREE.PointLight(0xffe8c8, 1.5, 6, 1.5); l.position.set(x, y, z); scene.add(l);
  }
  hint.textContent = matchMedia('(pointer: coarse)').matches
    ? 'Left stick: walk · Drag right side: look' : 'WASD / arrows: walk · Drag: look';
  setTimeout(() => hint.style.display = 'none', 6000);
}, undefined, e => hint.textContent = 'Could not load unit.glb: ' + e.message);

// player state (metres; x east, z south)
const R = 0.18, pos = new THREE.Vector3(cfg.spawn[0], cfg.eye, cfg.spawn[1]);
let yaw = 0, pitch = 0;               // yaw 0 = facing north (-z), toward the balcony
const at = new URLSearchParams(location.search).get('at');   // ?at=x,z,yawDeg (metres) to link straight into a room
if (at) { const [x, z, y] = at.split(',').map(Number); pos.x = x; pos.z = z; yaw = (y || 0) * Math.PI / 180; }
const keys = {}, move = { x: 0, y: 0 };

const hit = (x, z) => cfg.boxes.some(b => x > b[0] - R && x < b[1] + R && z > b[2] - R && z < b[3] + R);

addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

// drag-to-look (mouse anywhere, touch on anything except the joystick)
const look = new Map();
renderer.domElement.addEventListener('pointerdown', e => look.set(e.pointerId, [e.clientX, e.clientY]));
addEventListener('pointermove', e => {
  const p = look.get(e.pointerId); if (!p) return;
  yaw -= (e.clientX - p[0]) * 0.005; pitch -= (e.clientY - p[1]) * 0.005;
  pitch = Math.max(-1.3, Math.min(1.3, pitch)); look.set(e.pointerId, [e.clientX, e.clientY]);
});
const endLook = e => look.delete(e.pointerId);
addEventListener('pointerup', endLook); addEventListener('pointercancel', endLook);

// joystick
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickId = null;
const setStick = e => {
  const r = stick.getBoundingClientRect();
  let dx = e.clientX - (r.left + 60), dy = e.clientY - (r.top + 60);
  const d = Math.hypot(dx, dy); if (d > 45) { dx *= 45 / d; dy *= 45 / d; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`; move.x = dx / 45; move.y = -dy / 45;
};
stick.addEventListener('pointerdown', e => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); setStick(e); e.stopPropagation(); });
stick.addEventListener('pointermove', e => e.pointerId === stickId && setStick(e));
const endStick = e => { if (e.pointerId !== stickId) return; stickId = null; move.x = move.y = 0; knob.style.transform = ''; };
stick.addEventListener('pointerup', endStick); stick.addEventListener('pointercancel', endStick);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  let f = move.y + ((keys.KeyW || keys.ArrowUp) ? 1 : 0) - ((keys.KeyS || keys.ArrowDown) ? 1 : 0);
  let s = move.x + ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0);
  const sp = 1.4 * dt;   // ~walking pace, m/s
  const dx = (-Math.sin(yaw) * f + Math.cos(yaw) * s) * sp, dz = (-Math.cos(yaw) * f - Math.sin(yaw) * s) * sp;
  if (!hit(pos.x + dx, pos.z)) pos.x += dx;      // per-axis so you slide along walls
  if (!hit(pos.x, pos.z + dz)) pos.z += dz;
  camera.position.copy(pos);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  renderer.render(scene, camera);
});
</script>
</body>
</html>
